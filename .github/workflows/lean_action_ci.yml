name: Lean Action CI

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install OpenSSL and native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev build-essential

      # Install the pinned toolchain and fetch Mathlib's compiled cache.
      - name: Set up Lean 4 toolchain and fetch Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: "false"

      # Lake tracks and builds the native FFI dependency for both executables.
      - name: Build the Lean project
        run: lake build Blackworm Bench bench Test test

      # Runs the correctness tests (chained encrypt/decrypt round trips,
      # including the mixed cipher-set chain and the one-way AES decrypt
      # round functions) and fails CI if any test case fails.
      - name: Run correctness tests
        run: lake exe test
