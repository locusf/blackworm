name = "blackworm"
version = "0.1.0"
keywords = ["math", "crypto"]
defaultTargets = ["Blackworm"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# The Mathlib header linter demands Mathlib's exact Apache-2.0 copyright
# wording; this project is GPLv3 (see LICENSE.txt), so it can never pass.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

[[lean_lib]]
name = "Blackworm"

# Benchmarking scaffolding: `Bench.lean` + `Bench/*.lean` (timing utilities
# and the benchmark case suite), built as a library and exposed as the
# `bench` executable below.
[[lean_lib]]
name = "Bench"

# `lake exe bench` — see Bench.lean for CLI usage.
#
# NOTE: `[[foreign_library]]` below is not a real Lake TOML target kind (the
# correct keyword is `extern_lib`, and `extern_lib` targets require a
# `lakefile.lean`, since they run arbitrary build steps — they cannot be
# declared in TOML), so that section has always been silently ignored by
# `lake build`. The OpenSSL C FFI shared library is instead produced by the
# separate CMake build (`./build.sh`, or
# `cmake -S . -B build && cmake --build build`), which must be run at least
# once before `lake build bench`/`lake exe bench` so `libopenssl_crypto.so`
# exists for the linker below to find. The `build/` directory is a generated
# artifact and is git-ignored, not committed.
[[lean_exe]]
name = "bench"
root = "Bench"
# `$ORIGIN` is a linker rpath token (resolved relative to the executable's own
# location at runtime, i.e. `.lake/build/bin/`), not a shell variable, so this
# stays portable across machines/CI runners instead of hardcoding an absolute
# path to one developer's checkout. Likewise, link against `-lssl -lcrypto`
# (resolved via the linker's default search path, populated by installing
# `libssl-dev`/equivalent) rather than a distro-specific absolute path such as
# `/usr/lib64/libssl.so.3`, which doesn't exist on Debian/Ubuntu (used by
# GitHub Actions' `ubuntu-latest` runners).
moreLinkArgs = [
  "build/libopenssl_crypto.so",
  "-Wl,-rpath,$ORIGIN/../../../build",
  "-lssl", "-lcrypto",
  "-Wl,--allow-shlib-undefined", "-rdynamic"
]

# OpenSSL FFI bindings
[[foreign_library]]
name = "openssl_crypto"
includes = ["openssl/evp.h"]
libs = ["ssl", "crypto"]
libDirs = ["/usr/lib/x86_64-linux-gnu", "/usr/local/lib", "/opt/homebrew/opt/openssl/lib"]
includeDirs = ["/usr/include", "/usr/local/include", "/opt/homebrew/opt/openssl/include"]
